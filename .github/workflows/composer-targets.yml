name: Composer Targets

on:
  push:
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: composer-targets-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  composer-targets:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: tests
            coverage: none
          - target: cs:check
            coverage: none
          - target: stan
            coverage: none
          - target: coverage
            coverage: pcov

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: ${{ matrix.coverage }}
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run composer target
        run: composer ${{ matrix.target }}
