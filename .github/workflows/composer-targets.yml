name: Composer Targets

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: composer-targets-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  composer-targets:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - tests
          - cs:check
          - stan
          - coverage

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run composer target
        run: composer ${{ matrix.target }}
